name: Build
on: [push, pull_request]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Install additional build dependencies
        run: sudo apt-get install -yqq gcc-aarch64-linux-gnu
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Build
        run: make -j$(nproc) CROSS_COMPILE=aarch64-linux-gnu-
      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qebspil
          path: out/qebspilaa64.efi
